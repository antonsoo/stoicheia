name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run verify:oracle
      - run: npx playwright install --with-deps chromium firefox
      - name: Verify the production reader in both browsers
        run: |
          npm run preview > /tmp/stoicheia-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4327/stoicheia/ > /dev/null; then
              break
            fi
            sleep 1
          done
          npm run test:browser
