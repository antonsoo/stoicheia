name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install portable-reading inspection tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: npm run check
      - run: npm run verify:oracle
      - run: npm run verify:triangles
      - run: npm run verify:right-angles
      - run: npm run verify:copying
      - run: npm run verify:nested
      - run: npm run verify:measure
      - run: npm run verify:ratios
      - run: npm run verify:solids
      - run: npm run verify:quadratrix
      - run: npx playwright install --with-deps chromium firefox
      - name: Verify the development quickstart
        run: |
          node node_modules/vite/bin/vite.js --host 127.0.0.1 --port 4328 --strictPort > /tmp/stoicheia-dev.log 2>&1 &
          dev_pid=$!
          trap 'kill "$dev_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4328/stoicheia/ > /dev/null; then
              break
            fi
            sleep 1
          done
          npm run test:dev -- http://127.0.0.1:4328/stoicheia/
          SOLIDS_DEVELOPMENT=1 npm run test:solids -- http://127.0.0.1:4328/stoicheia/ /tmp/stoicheia-solids-dev
          npm run verify:solids-files -- /tmp/stoicheia-solids-dev
      - name: Verify the production reader in both browsers
        run: |
          node node_modules/vite/bin/vite.js preview --host 127.0.0.1 --port 4327 --strictPort > /tmp/stoicheia-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4327/stoicheia/ > /dev/null; then
              break
            fi
            sleep 1
          done
          npm run test:browser
          npm run test:nested -- http://127.0.0.1:4327/stoicheia/
          npm run test:illustrated -- /tmp/stoicheia-illustrated
          npm run test:desk -- /tmp/stoicheia-desk
          npm run test:measure -- /tmp/stoicheia-measure
          npm run test:copying -- /tmp/stoicheia-copying
          node scripts/copying-integrity.mjs /tmp/stoicheia-copying-integrity.json
          npm run test:ratios -- /tmp/stoicheia-ratios
          python3 scripts/ratios-artifacts.py /tmp/stoicheia-ratios
          npm run test:quadratrix -- /tmp/stoicheia-quadratrix
          python3 scripts/quadratrix-oracle.py --browser /tmp/stoicheia-quadratrix/review.json
          npm run test:solids -- http://127.0.0.1:4327/stoicheia/ /tmp/stoicheia-solids
          npm run verify:solids-files -- /tmp/stoicheia-solids
          node scripts/solids-integrity.mjs http://127.0.0.1:4327/stoicheia/ /tmp/stoicheia-solids-integrity
      - name: Verify an authentic eleven-room to twelve-room upgrade
        run: |
          git fetch --depth=1 origin c4ceb91ed96d1eb5fbc5c9687f2b7b690d4bf677
          mkdir /tmp/stoicheia-eleven
          git archive FETCH_HEAD | tar -x -C /tmp/stoicheia-eleven
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/stoicheia-eleven/node_modules
          (cd /tmp/stoicheia-eleven && npm run build)
          node scripts/solids-upgrade.mjs /tmp/stoicheia-eleven/dist /tmp/stoicheia-solids-upgrade.json
          python3 scripts/solids-artifacts.py /tmp/stoicheia-solids-upgrade.json --upgrade
