if}.ml-point-label{fill:#193d60;paint-order:stroke;stroke:#f7fafc;stroke-width:4px;stroke-linejoin:round;pointer-events:none;font:19px Noto Serif,Georgia,serif}.ml-contact{fill:#193d60;stroke:#f7fafc;stroke-width:2px}.ml-line-contact{fill:#a24b2b}.ml-mismatch{stroke:#a24b2b;stroke-width:5px;opacity:.65}.ml-diagram-note{fill:#52677b;font:12px sans-serif}.ml-proof-lines line{stroke:#193d60;stroke-width:1.4px}.ml-proof-one{fill:#386a9426;stroke:#386a94;stroke-width:2px}.ml-proof-two{fill:#6947803b;stroke:#694780;stroke-width:2px}.ml-cube-original path{fill:#d4e3ed;stroke:#386a94}.ml-cube-new path{fill:#d1e4df;stroke:#2a6557}.ml-cube-double path{fill:#edd7cc;stroke:#a24b2b}.ml-cube-panel svg path{stroke-width:1.3px}.ml-cube-panel svg text{fill:#193d60;font:14px sans-serif}.ml-license{white-space:pre-wrap;overflow-wrap:anywhere;font-size:11px;line-height:1.6}.ml-saved main{max-width:1100px;margin:auto;padding:30px}.ml-saved svg{width:100%}.ml-source-sheet{break-before:page;margin:40px 0}.ml-source-sheet img{width:auto;max-width:100%;height:auto;max-height:245mm;margin:auto;display:block}.ml-source-sheet figcaption{overflow-wrap:anywhere;margin:12px 0;font-size:11px}@media (width&lt;=1000px){.ml-workshop{grid-template-columns:minmax(0,1fr) 275px}.ml-controls{padding:23px 18px}.ml-plate-head{flex-wrap:wrap}.ml-intro h1{font-size:3rem}}@media (width&lt;=700px){.ml-header{flex-direction:column;align-items:start;gap:18px;padding:20px}.ml-header nav{gap:12px 20px;font-size:12px}.mesolabe-page main{padding:0 20px}.ml-intro{grid-template-columns:1fr;gap:15px;padding:40px 0 25px}.ml-intro h1{font-size:2.55rem}.ml-kicker{font-size:9px}.ml-intro-copy{padding-top:0;font-size:15px}.ml-workshop{grid-template-columns:minmax(0,1fr)}.ml-plate{padding:22px 12px}.ml-plate-head{gap:10px}.ml-plate-head h2{font-size:20px}#ml-machine svg{max-width:360px;margin:12px auto}.ml-controls{border-left:0;border-top:1px solid var(--rule);padding:25px 22px}.ml-alignment{padding:22px}.ml-results,.ml-sect