om:10px;font:25px Noto Serif,Georgia,serif;display:block}.ml-section{border-top:1px solid var(--rule);padding:58px 0;scroll-margin:20px}.ml-section-heading{grid-template-columns:1fr 1fr;gap:6vw;margin-bottom:30px;display:grid}.ml-section h2{letter-spacing:-.025em;margin-bottom:10px;font:clamp(2rem,3.1vw,3rem)/1.15 Noto Serif,Georgia,serif}.ml-section-heading&gt;p{max-width:550px;padding-top:24px;font-size:14px}.ml-stages{flex-wrap:wrap;gap:8px;margin:25px 0;display:flex}.ml-stages button{border:1px solid var(--rule);padding:10px 13px;font-size:12px}.ml-stages button[aria-pressed=true]{background:var(--ink);color:var(--folio)}#ml-proof-plate{max-width:900px}#ml-proof-plate svg{background:var(--folio);width:100%}#ml-proof-note{max-width:800px;margin:24px 0 20px;font-size:16px}.ml-proof-wait{background:var(--folio);border:1px dashed var(--rule);padding:28px;font-size:14px}.ml-section details{border-top:1px solid var(--rule);margin-top:25px;padding:20px 0 0}.ml-section summary{cursor:pointer;padding:5px 0;font-size:14px}.ml-section details p{max-width:850px;margin:20px 0;font-size:14px}.ml-select-label{max-width:450px;font-size:12px;display:block}.mesolabe-page select{font:inherit;color:inherit;border:1px solid var(--rule);background:var(--folio);max-width:100%;margin-top:8px;padding:11px;display:block}.mesolabe-page select:focus-visible{outline:3px solid var(--accent);outline-offset:4px}#ml-passage{width:100%}#ml-passage-text h3{margin:34px 0;font:26px Noto Serif,Georgia,serif}.ml-languages{grid-template-columns:1fr 1fr;gap:0 4vw;display:grid}.ml-languages&gt;div:last-child{grid-column:1/-1;max-width:850px}.ml-languages [lang]{font:22px/1.85 Noto Serif,Georgia,serif}.ml-languages&gt;div:last-child p:last-child{font-size:17px;line-height:1.8}.ml-word-note{background:var(--folio);padding:25px 28px}.ml-word-note h4{margin:0 0 16px;font:19px Noto Serif,Georgia,serif}.ml-word-note p{max-width:900px;font-size:14px}.ml-reading-nav{justify-content:space-between;align-items:cen