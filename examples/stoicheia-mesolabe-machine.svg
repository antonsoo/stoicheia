 Source: Eutocius, Heiberg 1881 III pp.106-113. This pose is a modern ideal geometry model; physical accuracy unverified.</metadata><style>.mesolabe-page{--accent:#a24b2b;--folio:#f7fafc}.ml-header{border-bottom:1px solid var(--rule);justify-content:space-between;align-items:center;gap:25px;padding:24px 4vw;display:flex}.ml-brand{font:24px Noto Serif,Georgia,serif;text-decoration:none}.ml-brand span{letter-spacing:.22em;margin-top:4px;font:11px ui-sans-serif,sans-serif;display:block}.ml-header nav{flex-wrap:wrap;gap:12px 25px;font-size:13px;display:flex}.mesolabe-page main{max-width:1450px;margin:auto;padding:0 4vw}.ml-intro{grid-template-columns:1.15fr 1fr;align-items:start;gap:6vw;padding:65px 0 45px;display:grid}.ml-kicker{letter-spacing:.13em;margin:0 0 18px;font-size:10px;font-weight:650;line-height:1.6}.ml-intro h1{letter-spacing:-.04em;margin-bottom:0;font-size:clamp(2.3rem,4.6vw,4.6rem);line-height:1.12}.ml-intro-copy{max-width:520px;padding-top:23px;font-size:16px}.ml-attribution{color:var(--muted);font-size:12px}#ml-notice:empty{display:none}.ml-workshop{border:1px solid var(--rule);background:var(--folio);grid-template-columns:minmax(0,1fr) 330px;display:grid}.ml-plate{background-image:linear-gradient(#386a940a 1px,#0000 1px),linear-gradient(90deg,#386a940a 1px,#0000 1px);background-size:22px 22px;min-width:0;padding:27px 20px 15px}.ml-plate-head{justify-content:space-between;align-items:center;gap:16px;padding:0 8px;display:flex}.ml-plate-head h2{margin:0;font:22px Noto Serif,Georgia,serif}.ml-plate-head span{white-space:nowrap;font:14px Noto Serif,Georgia,serif}#ml-machine{touch-action:pan-y}#ml-machine [data-plate]{cursor:grab;touch-action:none}#ml-machine svg{width:100%;margin-top:8px;display:block;overflow:visible}.ml-machine-help{max-width:650px;margin:0;padding:0 8px;font-size:12px}.ml-controls{border-left:1px solid var(--rule);padding:27px 26px}.ml-controls p{font-size:12px}.ml-controls label{margin:23px 0 10px;font-size:12px;font-weight:600;displ