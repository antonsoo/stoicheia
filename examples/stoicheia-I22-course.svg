</style><title id="diagram-title">I.22 · Step 8: What was required to be made</title><desc id="diagram-description">Three given lengths are placed consecutively as ΔΖ, ΖΗ and ΗΘ. Circles at Ζ and Η supply a common vertex Κ only when all three strict inequalities hold. The middle copy ΖΗ remains the base.  Α, Β and Γ name given lengths here; Ζ, Η and Κ name the triangle&#39;s vertices. Copy lengths with I.2–3, then draw circles through available points. Flip the plate to choose the reflected vertex. For an unconstrained trial hinge and finer length controls, open the separate I.22 workshop.</desc><rect class="plate-background" width="720" height="620"/><g><polygon data-figure="constructed" class="figure figure-first" points="284.698,376.482 420.377,376.482 344.567,232.395" /><circle data-entity="circle-Z" data-radius="207" class="curve auxiliary" cx="284.698" cy="376.482" r="156.03" /><circle data-entity="circle-H" data-radius="216" class="curve auxiliary" cx="420.377" cy="376.482" r="162.814" /><line data-entity="given-Α" data-length="207" class="edge given" x1="284.698" y1="134.975" x2="440.729" y2="134.975" /><line class="tick given" x1="362.713" y1="140.975" x2="362.713" y2="128.975" /><line data-entity="given-Β" data-length="180" class="edge given" x1="284.698" y1="105.126" x2="420.377" y2="105.126" /><line class="tick given" x1="349.538" y1="111.126" x2="349.538" y2="99.126" /><line class="tick given" x1="355.538" y1="111.126" x2="355.538" y2="99.126" /><line data-entity="given-Γ" data-length="216" class="edge given" x1="284.698" y1="75.276" x2="447.513" y2="75.276" /><line class="tick given" x1="360.106" y1="81.276" x2="360.106" y2="69.276" /><line class="tick given" x1="366.106" y1="81.276" x2="366.106" y2="69.276" /><line class="tick given" x1="372.106" y1="81.276" x2="372.106" y2="69.276" /><line data-entity="ray" data-length="642.6" class="edge auxiliary" x1="128.668" y1="376.482" x2="613.04" y2="376.482" /><line data-entity="DZ" data-length="207" class="e