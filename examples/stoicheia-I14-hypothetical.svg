</style><title id="diagram-title">I.14 · Step 6: The smaller cannot equal the larger</title><desc id="diagram-description">Hypothetical sketch: the original angle pair totals two right angles; Ε lies off ΓΒΔ. The supposition would force a smaller angle equal to a larger one, so it cannot be realized by this or any plane figure.  Ε is drawn off ΓΒΔ, following the printed arrangement. The proof temporarily calls ΓΒΕ one straight line. That claim cannot hold together with the original angle premise and a different Ε. Measurements describe the drawing; conditional equalities describe the rejected supposition.</desc><rect class="plate-background" width="720" height="470"/><g><line data-entity="CD" data-length="360" class="edge given" x1="97.705" y1="353.86" x2="622.295" y2="353.86" /><line data-entity="BA" data-length="180" class="edge given" x1="360" y1="353.86" x2="249.149" y2="116.14" /><line data-entity="BE-supposed" data-length="180" class="edge auxiliary" x1="360" y1="353.86" x2="616.563" y2="299.326" /><polyline data-angle="ABC" class="angle-mark given" points="348.167,328.483 346.747,329.195 345.37,329.986 344.04,330.854 342.761,331.796 341.538,332.809 340.375,333.889 339.274,335.034 338.24,336.239 337.276,337.501 336.385,338.816 335.57,340.179 334.834,341.586 334.178,343.032 333.606,344.513 333.119,346.025 332.718,347.561 332.404,349.118 332.18,350.69 332.045,352.273 332,353.86" /><polyline data-angle="ABD" class="angle-mark working" points="348.167,328.483 350.769,327.426 353.464,326.634 356.224,326.116 359.023,325.877 361.831,325.92 364.621,326.244 367.365,326.846 370.034,327.72 372.603,328.857 375.044,330.245 377.335,331.871 379.45,333.718 381.371,335.769 383.076,338.001 384.548,340.392 385.774,342.92 386.741,345.557 387.438,348.278 387.859,351.055 388,353.86" /><polyline data-angle="ABD" class="angle-mark working" points="346.476,324.858 349.45,323.649 352.53,322.744 355.685,322.152 358.883,321.879 362.093,321.929 365.281,322.299 368.417,322.987 371.468,323.