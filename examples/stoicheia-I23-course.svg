</style><title id="diagram-title">I.23 · Step 7: The requested angle has been made</title><desc id="diagram-description">Choose arbitrary points Δ and Ε on the two sides of the given angle at Γ. Join them. I.22 constructs a triangle at Α on the given line, with ΓΔ = ΑΖ, ΓΕ = ΑΗ and ΔΕ = ΖΗ. I.8 then proves the two included angles equal. A degree measurement is not the construction.  Change the two point distances without changing the given angle. The auxiliary triangles change; the copied angle does not. Tilting ΑΒ changes the new ray&#39;s direction while retaining the relative opening. Both reflected copies have the same angular magnitude. Degrees and coordinates are modern illustrations; I.22 and I.8 supply the source&#39;s construction and proof.</desc><rect class="plate-background" width="720" height="620"/><g><polygon data-figure="reference" class="figure figure-first" points="238.974,230.022 305.679,93.258 413.963,230.022" /><polygon data-figure="copy" class="figure figure-second" points="238.974,534.351 241.63,382.209 397.568,460.397" /><line data-entity="given-ray-D" data-length="225" class="edge given" x1="238.974" y1="230.022" x2="322.355" y2="59.066" /><line data-entity="given-ray-E" data-length="231.84" class="edge given" x1="238.974" y1="230.022" x2="434.962" y2="230.022" /><line data-entity="AB" data-length="306" class="edge given" x1="238.974" y1="534.351" x2="473.417" y2="425.028" /><line data-entity="DE" data-length="206.353" class="edge active" x1="305.679" y1="93.258" x2="413.963" y2="230.022" /><line class="tick active" x1="351.392" y1="160.66" x2="360.801" y2="153.211" /><line class="tick active" x1="355.117" y1="165.364" x2="364.525" y2="157.916" /><line class="tick active" x1="358.841" y1="170.069" x2="368.25" y2="162.62" /><line data-entity="AH" data-length="207" class="edge working" x1="238.974" y1="534.351" x2="397.568" y2="460.397" /><line class="tick working" x1="318.088" y1="504.08" x2="313.016" y2="493.204" /><line class="tick working"