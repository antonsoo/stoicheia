</style><title id="diagram-title">I.20 · Step 8: Construct the other two comparisons</title><desc id="diagram-description">I.20: continue ΒΓ beyond Γ, copy ΓΑ to ΓΔ, and join ΔΑ. I.5 and the proper-part relation give a greater angle in ΔΑΒ; I.19 gives ΔΒ &gt; ΒΑ. The copied length replaces ΔΓ, yielding ΒΓ + ΓΑ &gt; ΒΑ.  Continue ΒΓ through Γ to Δ; copy ΓΑ to ΓΔ and join ΔΑ. The angle at Α in ΔΑΒ contains the isosceles angle as a proper part. I.19 makes ΔΒ longer than ΒΑ. The original passage remains unchanged.</desc><rect class="plate-background" width="720" height="470"/><g><line data-entity="AB" data-length="180" class="edge given" x1="227.578" y1="366.931" x2="514.256" y2="366.931" /><line data-entity="AC" data-length="117" class="edge given" x1="227.578" y1="366.931" x2="347.355" y2="224.185" /><line data-entity="BC" data-length="137.894" class="edge given" x1="514.256" y1="366.931" x2="347.355" y2="224.185" /><line data-entity="continuation" data-length="117" class="edge auxiliary" x1="347.355" y1="224.185" x2="205.744" y2="103.069" /><line data-entity="copy" data-length="117" class="edge result" x1="347.355" y1="224.185" x2="205.744" y2="103.069" /><line class="tick result" x1="280.449" y1="159.067" x2="272.65" y2="168.187" /><line data-entity="reference" data-length="117" class="edge result" x1="347.355" y1="224.185" x2="227.578" y2="366.931" /><line class="tick result" x1="282.87" y1="291.701" x2="292.063" y2="299.415" /><line data-entity="join" data-length="166.24" class="edge active" x1="205.744" y1="103.069" x2="227.578" y2="366.931" /><polyline data-angle="isosceles-D" class="angle-mark active" points="227.023,121.268 226.296,122.085 225.539,122.872 224.751,123.63 223.934,124.356 223.089,125.049 222.218,125.71 221.322,126.335 220.402,126.925 219.46,127.479 218.497,127.996 217.515,128.475 216.514,128.915 215.498,129.315 214.466,129.676 213.421,129.996 212.364,130.275 211.297,130.513 210.222,130.709 209.14,130.862 208.053,130.974" /><polyline data-angle="i