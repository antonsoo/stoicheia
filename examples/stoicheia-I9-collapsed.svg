</style><title id="diagram-title">I.9 · Step 8: Use I.8 to obtain the equal angle parts</title><desc id="diagram-description">Angle ΒΑΓ. Δ is chosen on ΑΒ and ΑΕ is cut equal to ΑΔ by I.3. An equilateral triangle is constructed on ΔΕ. At 60°, Α is already the near equilateral vertex on ΔΕ. Choosing that crossing makes Ζ = Α: ΑΖ has zero length and supplies no ray. The triangles required for I.8 collapse, so this choice cannot execute the proof. Choose the other circle crossing: ΑΖ has zero length and cannot bisect the angle. At 60°, Α is already the near equilateral vertex on ΔΕ. Choosing that crossing makes Ζ = Α: ΑΖ has zero length and supplies no ray. The triangles required for I.8 collapse, so this choice cannot execute the proof.</desc><rect class="plate-background" width="720" height="470"/><g><circle data-entity="circle-d" data-radius="99" class="curve auxiliary" cx="285.325" cy="227.367" r="149.351" /><circle data-entity="circle-e" data-radius="99" class="curve auxiliary" cx="434.675" cy="227.367" r="149.351" /><line data-entity="AB" data-length="180" class="edge given" x1="360" y1="98.026" x2="224.227" y2="333.192" /><line data-entity="AC" data-length="225" class="edge given" x1="360" y1="98.026" x2="529.717" y2="391.983" /><line data-entity="AD" data-length="99" class="edge result" x1="360" y1="98.026" x2="285.325" y2="227.367" /><line class="tick result" x1="317.466" y1="159.697" x2="327.859" y2="165.696" /><line data-entity="AE" data-length="99" class="edge result" x1="360" y1="98.026" x2="434.675" y2="227.367" /><line class="tick result" x1="392.141" y1="165.696" x2="402.534" y2="159.697" /><line data-entity="DE" data-length="99" class="edge working" x1="285.325" y1="227.367" x2="434.675" y2="227.367" /><line data-entity="DZ" data-length="99" class="edge active" x1="285.325" y1="227.367" x2="360" y2="98.026" /><line class="tick active" x1="326.359" y1="168.295" x2="315.966" y2="162.295" /><line class="tick active" x1="329.359" y1="163.098" x2="318.966" 