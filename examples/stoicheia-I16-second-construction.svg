</style><title id="diagram-title">I.16 · Step 9: Bisect ΒΓ and repeat for the other interior angle</title><desc id="diagram-description">Second construction: I.10 bisects ΒΓ at Θ; extending ΑΘ to Κ copies ΘΑ. The triangles ΒΘΑ and ΓΘΚ correspond by I.15 and I.4. Their angle copy sits inside ΒΓΗ, equal to exterior ΑΓΔ. Θ and Κ are modern labels.  Now bisect ΒΓ at Θ, extend ΑΘ to Κ with ΘΚ = ΘΑ, and join ΚΓ. Θ and Κ are modern labels expanding the source&#39;s abbreviated instruction. The copied angle lies inside ΒΓΗ, which is vertically opposite and equal to ΑΓΔ.</desc><rect class="plate-background" width="720" height="470"/><g><polygon data-figure="BTA" class="figure figure-first" points="149.499,235 285.306,235 262.982,99.755" /><polygon data-figure="CTK" class="figure figure-second" points="421.113,235 285.306,235 307.629,370.245" /><line data-entity="AB" data-length="117" class="edge given" x1="262.982" y1="99.755" x2="149.499" y2="235" /><line data-entity="BC" data-length="180" class="edge given" x1="149.499" y1="235" x2="421.113" y2="235" /><line data-entity="CA" data-length="137.894" class="edge given" x1="421.113" y1="235" x2="262.982" y2="99.755" /><line data-entity="CD" data-length="99" class="edge working" x1="421.113" y1="235" x2="570.501" y2="235" /><line data-entity="CH" data-length="75.842" class="edge auxiliary" x1="421.113" y1="235" x2="508.085" y2="309.385" /><line data-entity="AK" data-length="181.68" class="edge working" x1="262.982" y1="99.755" x2="307.629" y2="370.245" /><line data-entity="CK" data-length="117" class="edge result" x1="421.113" y1="235" x2="307.629" y2="370.245" /><line data-entity="BT" data-length="90" class="edge result" x1="149.499" y1="235" x2="285.306" y2="235" /><line class="tick result" x1="217.402" y1="241" x2="217.402" y2="229" /><line data-entity="TC" data-length="90" class="edge result" x1="285.306" y1="235" x2="421.113" y2="235" /><line class="tick result" x1="353.209" y1="241" x2="353.209" y2="229" /><line data-entit