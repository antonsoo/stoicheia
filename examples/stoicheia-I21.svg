</style><title id="diagram-title">I.21 · Step 10: Keep both conclusions together</title><desc id="diagram-description">Δ is strictly inside triangle ΑΒΓ. Continue ΒΔ to Ε on ΑΓ. Two applications of I.20 give ΒΑ + ΑΓ &gt; ΒΕ + ΕΓ &gt; ΒΔ + ΔΓ. Two applications of I.16 give angle ΒΔΓ &gt; ΓΕΒ &gt; ΒΑΓ. The shorter broken path encloses the larger angle.  Ε is 55% along ΑΓ and Δ is 55% along ΒΕ. These two position controls cover interior points while retaining the proof&#39;s hypotheses. The intermediate route Β–Ε–Γ explains both inequalities. Drawing units and degree readings are modern illustrations, not premises of the proof.</desc><rect class="plate-background" width="720" height="470"/><g><line data-entity="AB" data-length="180" class="edge given" x1="142.834" y1="343.133" x2="577.166" y2="343.133" /><line data-entity="AC" data-length="117" class="edge given" x1="142.834" y1="343.133" x2="324.303" y2="126.867" /><line data-entity="BC" data-length="137.894" class="edge given" x1="577.166" y1="343.133" x2="324.303" y2="126.867" /><line data-entity="BD" data-length="80.927" class="edge result" x1="577.166" y1="343.133" x2="393.178" y2="277.713" /><line data-entity="DC" data-length="68.723" class="edge result" x1="393.178" y1="277.713" x2="324.303" y2="126.867" /><line data-entity="DE" data-length="66.213" class="edge auxiliary" x1="393.178" y1="277.713" x2="242.642" y2="224.187" /><polyline data-angle="inner" class="angle-mark active" points="419.56,287.094 420.475,283.949 421.016,280.719 421.177,277.447 420.954,274.18 420.352,270.961 419.377,267.834 418.044,264.842 416.371,262.026 414.381,259.425 412.1,257.075 409.561,255.006 406.797,253.249 403.848,251.826 400.752,250.757 397.552,250.057 394.293,249.735 391.018,249.796 387.773,250.24 384.602,251.059 381.548,252.242" /><polyline data-angle="inner" class="angle-mark active" points="423.329,288.434 424.374,284.84 424.993,281.148 425.177,277.409 424.922,273.675 424.234,269.996 423.12,266.422 421.597,263.003 419.685,259.